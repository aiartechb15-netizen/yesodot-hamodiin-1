<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>יסודות המודיעין — קורס מתוקשב</title>
    <meta name="description" content="קורס מתוקשב — יסודות המודיעין" />
    <style>
      /* ==========================================================
         משתני העיצוב
         ========================================================== */

      :root {
        /* palette */
        --navy: #071a2d;
        --navy-secondary: #123955;
        --teal: #17989a;
        --teal-light: #c6e1e0;
        --gold: #c4a347;
        --cream: #f5f0e6;
        --paper: #fbf8f1;
        --white: #ffffff;
        --text: #172436;
        --muted: #6c716f;
        --border: #ded9cf;

        /* derived */
        --navy-70: rgba(7, 26, 45, 0.7);
        --gold-soft: rgba(196, 163, 71, 0.28);
        --teal-soft: rgba(23, 152, 154, 0.12);
        --shadow-sm: 0 1px 2px rgba(7, 26, 45, 0.05);
        --shadow-card: 0 2px 10px rgba(7, 26, 45, 0.06), 0 1px 2px rgba(7, 26, 45, 0.04);
        --shadow-card-hover: 0 10px 28px rgba(7, 26, 45, 0.1), 0 2px 6px rgba(7, 26, 45, 0.05);

        /* geometry */
        --radius-sm: 6px;
        --radius: 10px;
        --radius-lg: 14px;
        --header-h: 88px;
        /* מערכת יישור אחת לכל האתר: אותו רוחב מרבי ואותם שוליים בכל עמוד.
           40px מכל צד בדסקטופ, 16px במסך צר. */
        --page-max: 1500px;
        --gutter: 40px;

        /* typography — מערכת של משפחה אחת בלבד לכל האתר: Frank Ruhl Libre,
           סריף עברי. נטען מ-Google Fonts ב-index.html (משקלים 300–900).
           --font-heading מפנה ל---font-primary: אין צורך בפונט כותרות נפרד,
           והמשתנה קיים כדי שאפשר יהיה להחליף כותרות בנקודה אחת בעתיד.
           אין --font-accent: לא נמצא תפקיד שמצדיק משפחה שלישית. */
        --font-primary: 'Frank Ruhl Libre', 'David Libre', 'Frank Ruehl CLM', 'Times New Roman', serif;
        --font-heading: var(--font-primary);
        --fs-hero: clamp(40px, 5.4vw, 68px);
        --fs-h2: clamp(26px, 2.6vw, 38px);
        --fs-h3: clamp(20px, 1.7vw, 25px);
        --fs-body: 17px;
        --fs-small: 15px;
        --lh-body: 1.8;

        /* rhythm */
        --section-y: clamp(56px, 6vw, 96px);
      }

      /* ==========================================================
         בסיס גלובלי
         ========================================================== */

      /* ---------- reset ---------- */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        font-family: var(--font-primary);
        /* גלילה חלקה לעוגנים בתוך אותו עמוד בלבד; מעבר בין עמודים מבוטל ב-ScrollToTop */
        scroll-behavior: smooth;
        scroll-padding-top: calc(var(--header-h) + 16px);
        -webkit-text-size-adjust: 100%;
        /* מונע מהדפדפן "לעגן" את הגלילה כשתוכן העמוד החדש נטען */
        overflow-anchor: none;
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
        }
      }

      body {
        margin: 0;
        background-color: var(--paper);
        color: var(--text);
        font-family: var(--font-primary);
        font-size: var(--fs-body);
        line-height: var(--lh-body);
        direction: rtl;
        text-align: right;
        overflow-x: hidden;
      }

      /* מרקם נייר עדין מאוד */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        opacity: 0.5;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='0.045'/></svg>");
      }

      #root {
        position: relative;
        z-index: 1;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: var(--font-heading);
      }

      h1,
      h2,
      h3,
      h4 {
        margin: 0;
        font-weight: 700;
        color: var(--navy);
        line-height: 1.25;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0 0 1em;
      }

      p:last-child {
        margin-bottom: 0;
      }

      a {
        color: var(--navy-secondary);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }

      input,
      select,
      textarea {
        font: inherit;
      }

      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      svg {
        display: block;
      }

      :focus-visible {
        outline: 3px solid var(--teal);
        outline-offset: 3px;
        border-radius: 4px;
      }

      /* ---------- layout ---------- */
      .container {
        width: calc(100% - var(--gutter) * 2);
        max-width: var(--page-max);
        margin-inline: auto;
      }

      .section {
        position: relative;
        padding-block: var(--section-y);
        scroll-margin-top: calc(var(--header-h) + 16px);
      }

      .section--white {
        background: var(--white);
        border-block: 1px solid var(--border);
      }

      .section--cream {
        background: var(--cream);
        border-block: 1px solid var(--border);
      }

      .section--paper {
        background: var(--paper);
      }

      .section--navy {
        background: var(--navy);
        color: var(--teal-light);
      }

      /* העוגנים נעצרים מתחת ל-Header בלבד */
      .chapterPage .section,
      .chapterPage .ch2hero,
      .chapterPage .ch3hero,
      .chapterPage .syl {
        scroll-margin-top: calc(var(--header-h) + 16px);
      }

      .split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: clamp(28px, 4vw, 64px);
        align-items: center;
      }

      .split--wideText {
        grid-template-columns: 1.05fr 0.95fr;
      }

      .stack-sm > * + * {
        margin-top: 12px;
      }

      .grid-3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 28px;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 28px;
      }

      /* ---------- typography helpers ---------- */
      .kicker {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: var(--teal);
        text-transform: none;
        margin-bottom: 10px;
      }

      .section-title {
        font-size: var(--fs-h2);
      }

      .section-title--center {
        text-align: center;
      }

      .gold-rule {
        display: block;
        width: 74px;
        height: 3px;
        background: var(--gold);
        border-radius: 2px;
        margin-block: 18px 22px;
      }

      .gold-rule--center {
        margin-inline: auto;
      }

      .gold-rule--sm {
        width: 48px;
        height: 2px;
        margin-block: 12px 14px;
      }

      .lead {
        font-size: 18px;
        color: var(--text);
      }

      .muted {
        color: var(--muted);
      }

      .small {
        font-size: var(--fs-small);
      }

      .term {
        font-weight: 700;
        color: var(--navy-secondary);
      }

      /* ---------- cards ---------- */
      .card {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-card);
      }

      .card--pad {
        padding: 26px 28px;
      }

      .card-title {
        font-size: var(--fs-h3);
      }

      /* ---------- בלוקי תוכן פתוחים ----------
         כותרת, קו זהב וטקסט — ללא מסגרת, רקע או צל. משמשים במקום כרטיס
         באזורים שבהם הכרטיס היה עטיפה ויזואלית בלבד; ההפרדה נעשית בקו דק. */
      .openGrid {
        display: grid;
        gap: clamp(24px, 3vw, 40px);
        margin-top: clamp(26px, 3vw, 38px);
      }

      .openGrid--2 {
        grid-template-columns: repeat(2, 1fr);
      }

      .openGrid--3 {
        grid-template-columns: repeat(3, 1fr);
      }

      .openGrid > * + * {
        padding-inline-start: clamp(24px, 3vw, 40px);
        border-inline-start: 1px solid var(--border);
      }

      .openBlock__icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--teal);
        margin-bottom: 12px;
      }

      .openBlock__title {
        font-size: var(--fs-h3);
        color: var(--navy);
      }

      .openBlock__example {
        color: var(--muted);
        font-size: 16px;
      }

      /* ---------- callouts ---------- */
      .callout {
        position: relative;
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 22px 26px;
        box-shadow: var(--shadow-sm);
      }

      .callout__label {
        display: inline-block;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--gold);
        margin-bottom: 8px;
      }

      .callout--teal {
        background: var(--teal-soft);
      }

      .callout--teal .callout__label {
        color: var(--teal);
      }

      .callout--example {
        background: var(--cream);
      }

      .callout--example .callout__label {
        color: var(--navy-secondary);
      }

      /* ---------- buttons ---------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 15px 34px;
        border: 1px solid var(--navy);
        border-radius: var(--radius-sm);
        background: var(--navy);
        color: var(--white);
        font-weight: 700;
        font-size: 17px;
        transition: background-color 0.18s ease, transform 0.18s ease;
      }

      .btn:hover {
        background: var(--navy-secondary);
        border-color: var(--navy-secondary);
        text-decoration: none;
      }

      .btn:active {
        transform: translateY(1px);
      }

      .btn--ghost {
        background: transparent;
        color: var(--navy);
      }

      .btn--ghost:hover {
        background: rgba(7, 26, 45, 0.06);
        color: var(--navy);
      }

      .btn--sm {
        padding: 10px 22px;
        font-size: 15px;
      }

      .btn[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
      }

      /* ---------- misc ---------- */
      .skip-link {
        position: absolute;
        right: 16px;
        top: -80px;
        z-index: 200;
        background: var(--white);
        color: var(--navy);
        padding: 12px 20px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        transition: top 0.2s ease;
      }

      .skip-link:focus {
        top: 12px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      /* בידוד דו-כיווני למספרים בתוך טקסט עברי.
         בלי display משלו: העיגולים הממוספרים באתר מגדירים inline-flex + מרכוז
         באותה ספציפיות, ו-display כאן היה דורס אותם ומוציא את הספרה מהמרכז. */
      .ltr-num {
        direction: ltr;
        unicode-bidi: isolate;
      }

      /* ---------- responsive ---------- */
      @media (max-width: 1000px) {
        .grid-3 {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 768px) {
        :root {
          --gutter: 16px;
        }
      }

      @media (max-width: 760px) {
        :root {
          --header-h: 72px;
        }
        .split,
        .split--wideText,
        .grid-3,
        .grid-2 {
          grid-template-columns: 1fr;
        }
        .grid-3,
        .grid-2 {
          gap: 20px;
        }
        .openGrid--2,
        .openGrid--3 {
          grid-template-columns: 1fr;
        }
        .openGrid > * + * {
          padding-inline-start: 0;
          border-inline-start: 0;
          padding-top: 24px;
          border-top: 1px solid var(--border);
        }
      }

      /* ==========================================================
         Header
         ========================================================== */

      .hdr {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--navy);
        color: var(--white);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      /* רוחב מלא: המיתוג נצמד לקצה הימני והלוגו לקצה השמאלי, עם padding מסודר */
      .hdr__inner {
        height: var(--header-h);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding-inline: clamp(20px, 2.4vw, 36px);
      }

      .hdr__brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--white);
        font-weight: 700;
        font-size: 17px;
      }

      /* line-height 1 — תיבת הטקסט שווה לגובה האותיות, כך שהאייקון יושב בדיוק על אותה שורה */
      .hdr__brandText {
        display: block;
        line-height: 1;
      }

      .hdr__brand svg {
        flex: none;
      }

      .hdr__brand:hover {
        text-decoration: none;
        color: var(--teal-light);
      }

      .hdr__brand svg {
        color: var(--gold);
      }

      /* לוגו ארטק — יחס מקורי נשמר, ללא חיתוך או מתיחה.
         הגובה מותאם למשקל הוויזואלי של המיתוג שמנגד. */
      .hdr__logo {
        display: block;
        height: 24px;
        width: auto;
        max-width: 40vw;
        object-fit: contain;
      }

      @media (max-width: 620px) {
        .hdr__logo {
          height: 20px;
        }
        .hdr__brand {
          font-size: 15.5px;
          gap: 9px;
        }
      }

      /* ==========================================================
         מסך הפתיחה
         ========================================================== */

      /* מסך פתיחה — תצלום העיצוב ממלא את המסך הראשון כולו.
         המסגרת מחושבת בעצמה לפי יחס התמונה, ולא רק דרך object-fit, כדי
         שהחיתוך יישלט: מה נחתך, מאיזה צד, ובאיזה יחס מסך. */
      .hero {
        --hero-ratio: 1.7211;
        position: relative;
        container-type: size;
        width: 100%;
        /* יתרת המסך שמתחת ל-Header, כך שכל העיצוב נכנס במסך הראשון */
        height: calc(100vh - var(--header-h));
        /* svh מודד את המסך כשסרגלי הדפדפן במובייל גלויים — בלי חיתוך תוכן */
        height: calc(100svh - var(--header-h));
        overflow: hidden;
      }

      /* גיבוי מטושטש של אותה תמונה, ממלא את מה שנשאר כשיחס המסך שונה
         מיחס התמונה. כך אין שוליים לבנים באף רזולוציה. */

        content: '';
        position: absolute;

        filter: blur(28px) saturate(0.92);
        transform: scale(1.12);
      }

      /* ברירת המחדל (מסכי דסקטופ): המסגרת מכסה את כל האזור.
         max() שקול ל-object-fit: cover, אבל כאן המידות ידועות ולכן אפשר
         לשלוט בהן.
         העיגון לימין במקום למרכז: כשיש חיתוך אופקי הוא נלקח כולו מצד
         התיק, כך שהכותרת והטקסט שבצד ימין לעולם אינם נחתכים. */
      .hero__frame {
        position: absolute;
        top: 50%;
        right: 0;
        transform: translateY(-50%);
        width: 100%;
        height: 100%;
        width: max(100cqw, calc(100cqh * var(--hero-ratio)));
        height: max(100cqh, calc(100cqw / var(--hero-ratio)));
      }

      /* object-fit כאן הוא רשת ביטחון: אם דפדפן אינו תומך ביחידות container
         המסגרת נשארת 100%/100%, והתמונה עדיין לא תתעוות */
      .hero__img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        /* התמונה דקורטיבית: בלי זה היא עלולה לחטוף את הלחיצה מהשכבה שמעליה */
        pointer-events: none;
      }

      /* החץ שבתחתית מסך הפתיחה — רמז לכך שהעמוד ממשיך למטה.
         בלי מסגרת, בלי רקע ובלי טקסט; שטח הלחיצה מעט גדול מהחץ עצמו,
         ולכן ה-padding וה-transform:translateX(-50%) על המרכז. */
      .hero__down {
        position: absolute;
        bottom: 34px;
        left: 50%;
        transform: translateX(-50%);
        display: block;
        padding: 6px;
        color: var(--navy);
        line-height: 0;
        cursor: pointer;
        /* הרקע מתחת לחץ הוא תצלום, ולכן הילה בהירה מאוד ששומרת עליו קריא
           גם מעל האזורים הכהים שבו */
        filter: drop-shadow(0 0 5px rgba(251, 248, 241, 0.75));
        animation: heroDown 3.4s ease-in-out infinite;
      }

      /* התנועה קטנה ואיטית בכוונה: רמז, לא הנפשה שמושכת את העין */
      @keyframes heroDown {
        0%,
        100% {
          transform: translate(-50%, 0);
        }
        50% {
          transform: translate(-50%, 7px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .hero__down {
          animation: none;
        }
      }

      /* מתחת ליחס 1.55 — טאבלטים ומובייל. כיסוי מלא היה מוחק את הכותרת,
         והכנסת כל התמונה הייתה מקטינה אותה לרצועה בלתי קריאה. לכן המסגרת
         מוגדלת כך שהחלק הימני של העיצוב — הכותרת והטקסט — ממלא את
         הרוחב בגודל קריא, והשאר נחתך מצד התיק. מה שנשאר מעל ומתחת מתמלא
         בגיבוי המטושטש, כך שאין שוליים לבנים. */
      @media (max-aspect-ratio: 155 / 100) {
        .hero {
          --hero-reveal: 0.58;
        }
        .hero__frame {
          width: min(calc(100cqw / var(--hero-reveal)), calc(100cqh * var(--hero-ratio)));
          height: min(calc(100cqw / var(--hero-reveal) / var(--hero-ratio)), 100cqh);
        }
      }

      /* ==========================================================
         מסך בחירת הפרקים
         ========================================================== */

      /* מסך בחירת הפרקים — הרצועה שבין ה-Header ל-Footer, ולא מסך מלא.
         הגובה הוא יתרת המסך אחרי שניהם, כך שבמסך דסקטופ רגיל נראים
         שלושתם יחד — Header, הכרטיסים ותחילת ה-Footer — בלי גלילה. */
      #topics {
        /* הגובה הנמדד של ה-Footer, כמשתנה ולא כמספר קסם בתוך ה-calc, כדי
           שיהיה ברור מה מנוכה מגובה המסך ולמה. הרצועה משלימה בדיוק את
           המסך: בלי זה הגלילה נעצרת מוקדם מדי ורצועה מתחתית מסך הפתיחה
           נשארת גלויה מתחת ל-Header */
        --footer-h: 132px;
        display: flex;
        align-items: center;
        min-height: calc(100vh - var(--header-h) - var(--footer-h));
        min-height: calc(100svh - var(--header-h) - var(--footer-h));
        /* אסימטרי בכוונה: המרווח התחתון גדול מהעליון, ולכן הכרטיסים יושבים
           מעל אמצע הרצועה ולא בדיוק במרכזה */
        padding-block: clamp(24px, 4vh, 56px) clamp(72px, 13vh, 150px);
        scroll-margin-top: -16px;
      }

      /* שוליים סימטריים שנעצרים ב-5 ס"מ, כדי שהכרטיסים ינצלו את רוחב המסך */
      #topics .container {
        width: 100%;
        max-width: none;
        padding-inline: clamp(16px, 5vw, 5cm);
      }

      .topics {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: clamp(20px, 2vw, 36px);
        align-items: stretch;
      }

      /* גובה נגזר מהרצועה ולא קבוע: שלושת הכרטיסים יוצאים זהים לחלוטין
         בכל רוחב מסך, וגדלים יחד עם המסך כך שהרצועה מתמלאת ולא נשארת ריקה.
         58vh-165px הוא כשבעים אחוז מגובה הרצועה הפנוי (100svh פחות
         ה-Header, ה-Footer וה-padding) — היתרה היא המרווחים מלמעלה
         ומלמטה. היחס נשאר לרוחב בכל רוחב מסך דסקטופ. */
      .topic {
        position: relative;
        display: block;
        height: clamp(255px, calc(58vh - 165px), 470px);
        overflow: hidden;
        background: var(--cream);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-card);
        color: inherit;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }

      .topic:hover {
        transform: translateY(-3px);
        box-shadow: var(--shadow-card-hover);
        border-color: var(--gold-soft);
        text-decoration: none;
      }

      .topic--soon:hover {
        transform: none;
        box-shadow: var(--shadow-card);
        border-color: var(--border);
      }

      /* התצלום ממלא את הכרטיס כולו. object-position מוסט ימינה בתוך
         התצלום, כך שמרכז התמונה נופל באזור השמאלי — החלק שאינו מכוסה */
      .topic__img {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 70% 50%;
        transition: transform 0.4s ease;
      }

      .topic:hover .topic__img {
        transform: scale(1.04);
      }

      /* המסך הקרמי — נפתח מהקצה הימני ונמוג אל תוך התצלום.
         רדיאלי ולא ליניארי, כדי שהמפגש בין הטקסט לתמונה יהיה רך ולא קו.
         251 248 241 הוא --paper; הוא נכתב כרכיבים כדי לשלוט בשקיפות. */
      .topic__veil {
        --veil: 251 248 241;
        position: absolute;
        inset: 0;
        background: radial-gradient(
          72% 145% at 100% 50%,
          rgb(var(--veil) / 1) 0%,
          rgb(var(--veil) / 0.99) 42%,
          rgb(var(--veil) / 0.86) 58%,
          rgb(var(--veil) / 0.46) 74%,
          rgb(var(--veil) / 0.12) 88%,
          rgb(var(--veil) / 0) 100%
        );
      }

      /* padding-inline: התחלה (ימין) לטקסט, סוף (שמאל) שומר את מחצית
         הכרטיס פנויה לתצלום */
      .topic__body {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding-inline: clamp(20px, 2.2vw, 30px) 42%;
        text-align: right;
      }

      .topic__kicker {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: var(--gold);
      }

      .topic__title {
        margin-top: 6px;
        font-size: clamp(20px, 1.5vw, 24px);
      }

      /* הפס הזהוב הוא כעת סוגר הכרטיס ולא מפריד לפני CTA, ולכן אין לו
         שוליים תחתונים שידחפו את גוש הטקסט מעלה מהמרכז */
      .topic__body .gold-rule--sm {
        margin-block: 12px 0;
      }

      @media (max-width: 1000px) {
        .topics {
          grid-template-columns: repeat(2, 1fr);
        }
        /* בשתי עמודות הכרטיסים נערמים לשתי שורות, ולכן הגובה נגזר מהרוחב
           ולא מהמסך — אחרת שתי שורות של כרטיס גבוה דוחפות את ה-Footer מטה */
        .topic {
          height: clamp(230px, 34vw, 320px);
        }
      }

      @media (max-width: 760px) {
        .topics {
          grid-template-columns: 1fr;
          gap: 18px;
        }
        .topic {
          height: clamp(178px, 46vw, 230px);
        }
        .topic__body {
          padding-inline: 22px 44%;
        }
      }

      /* ==========================================================
         Footer
         ========================================================== */

      .ftr {
        background: var(--navy);
        color: rgba(255, 255, 255, 0.78);
        padding-block: 38px;
      }

      .ftr__inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
        flex-wrap: wrap;
      }

      .ftr__brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .ftr__brand svg {
        color: var(--gold);
      }

      .ftr__title {
        display: block;
        color: var(--white);
        font-weight: 700;
        font-size: 17px;
      }

        display: block;
        font-size: 14px;

        justify-content: flex-end;

        width: 1px;
        height: 15px;
        flex: none;
        background: rgba(255, 255, 255, 0.28);
      }

        color: rgba(255, 255, 255, 0.92);
        font-weight: 600;
        font-size: 16px;
      }

      .ftr__creditsName {

        font-size: 13.5px;
        white-space: nowrap;
      }

        .ftr__inner {
          flex-direction: column;
          align-items: flex-start;
          gap: 20px;
        }
        .ftr__credits {
          justify-content: flex-start;
        }
      }

    <script>
      (function () {
        var SCROLL_MS = 900;
        var ease = function (t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
        var link = document.querySelector('.hero__down');
        if (!link) return;
        link.addEventListener('click', function (event) {
          var target = document.getElementById('topics');
          if (!target || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
          event.preventDefault();
          var styles = getComputedStyle(document.documentElement);
          var offset = (parseFloat(styles.scrollPaddingTop) || 0) + (parseFloat(getComputedStyle(target).scrollMarginTop) || 0);
          var start = window.pageYOffset;
          var end = Math.min(
            target.getBoundingClientRect().top + start - offset,
            document.documentElement.scrollHeight - window.innerHeight
          );
          var t0 = null;
          var step = function (now) {
            if (t0 === null) t0 = now;
            var progress = Math.min((now - t0) / SCROLL_MS, 1);
            window.scrollTo({ top: start + (end - start) * ease(progress), behavior: 'instant' });
            if (progress < 1) requestAnimationFrame(step);
            else history.replaceState(null, '', '#topics');
          };
          requestAnimationFrame(step);
        });
      })();
    </script>
